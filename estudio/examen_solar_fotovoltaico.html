<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Examen — Generación Distribuida Solar Fotovoltaica</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --sun: #F5A623;
    --sun-dark: #D4881A;
    --sky: #0A1628;
    --sky-mid: #0F2044;
    --sky-light: #162B55;
    --panel: #1C3461;
    --accent: #3DD6F5;
    --accent2: #F5A623;
    --correct: #2ECC71;
    --wrong: #E74C3C;
    --neutral: #4A6FA5;
    --text: #E8EDF5;
    --text-dim: #8DA4C8;
    --card: #0F2044;
    --card-border: #1E3A6E;
    --radius: 12px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Sora', sans-serif;
    background: var(--sky);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* SUN RAYS BG */
  body::before {
    content: '';
    position: fixed;
    top: -200px; left: 50%;
    transform: translateX(-50%);
    width: 900px; height: 900px;
    background: radial-gradient(ellipse at center, rgba(245,166,35,0.12) 0%, rgba(245,166,35,0.04) 40%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  /* HEADER */
  header {
    position: relative;
    text-align: center;
    padding: 60px 20px 40px;
    border-bottom: 1px solid var(--card-border);
    background: linear-gradient(180deg, rgba(245,166,35,0.07) 0%, transparent 100%);
    z-index: 1;
  }

  .sun-icon {
    display: inline-block;
    width: 56px; height: 56px;
    background: var(--sun);
    border-radius: 50%;
    box-shadow: 0 0 0 8px rgba(245,166,35,0.15), 0 0 0 16px rgba(245,166,35,0.07), 0 0 60px rgba(245,166,35,0.4);
    margin-bottom: 20px;
    position: relative;
  }
  .sun-icon::before {
    content: '☀';
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%,-50%);
    font-size: 28px;
    line-height: 1;
  }

  header h1 {
    font-size: clamp(1.5rem, 3vw, 2.4rem);
    font-weight: 700;
    letter-spacing: -0.5px;
    line-height: 1.2;
    color: #fff;
  }
  header h1 span { color: var(--sun); }

  header p {
    margin-top: 10px;
    color: var(--text-dim);
    font-size: 0.95rem;
    font-weight: 300;
  }

  /* STATS BAR */
  .stats-bar {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(10,22,40,0.92);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--card-border);
    padding: 12px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }

  .stats-bar .stat {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.85rem;
    color: var(--text-dim);
  }
  .stats-bar .stat strong {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 1.05rem;
    color: var(--text);
  }
  .stat-dot { width: 8px; height: 8px; border-radius: 50%; }
  .dot-answered { background: var(--accent); }
  .dot-correct  { background: var(--correct); }
  .dot-wrong    { background: var(--wrong); }

  .progress-wrap {
    flex: 1;
    min-width: 160px;
    height: 6px;
    background: var(--sky-light);
    border-radius: 99px;
    overflow: hidden;
  }
  .progress-bar {
    height: 100%;
    background: linear-gradient(90deg, var(--sun), var(--accent));
    border-radius: 99px;
    transition: width 0.4s ease;
    width: 0%;
  }

  /* MAIN */
  main {
    max-width: 860px;
    margin: 0 auto;
    padding: 40px 20px 120px;
    position: relative;
    z-index: 1;
  }

  /* SECTION HEADING */
  .section-heading {
    display: flex;
    align-items: center;
    gap: 14px;
    margin: 50px 0 24px;
  }
  .section-number {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.7rem;
    font-weight: 600;
    color: var(--sun);
    letter-spacing: 2px;
    text-transform: uppercase;
    white-space: nowrap;
    padding: 4px 10px;
    border: 1px solid rgba(245,166,35,0.3);
    border-radius: 4px;
  }
  .section-title {
    font-size: 0.95rem;
    font-weight: 600;
    color: var(--text-dim);
    letter-spacing: 0.3px;
  }
  .section-line {
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, var(--card-border), transparent);
  }

  /* QUESTION CARD */
  .question-card {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: var(--radius);
    padding: 28px;
    margin-bottom: 16px;
    transition: border-color 0.3s, box-shadow 0.3s;
    position: relative;
  }
  .question-card:hover {
    border-color: rgba(61,214,245,0.2);
  }

  /* State borders */
  .question-card.all-correct  { border-color: rgba(46,204,113,0.5); box-shadow: 0 0 20px rgba(46,204,113,0.08); }
  .question-card.has-wrong    { border-color: rgba(231,76,60,0.4);  box-shadow: 0 0 20px rgba(231,76,60,0.08); }

  .question-number {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.72rem;
    font-weight: 600;
    color: var(--accent);
    letter-spacing: 2px;
    margin-bottom: 10px;
    display: block;
  }
  .question-text {
    font-size: 1rem;
    font-weight: 400;
    line-height: 1.65;
    color: var(--text);
    margin-bottom: 20px;
  }

  /* OPTIONS */
  .options { display: flex; flex-direction: column; gap: 8px; }

  .option-label {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 12px 16px;
    border-radius: 8px;
    border: 1.5px solid var(--card-border);
    cursor: pointer;
    transition: all 0.2s;
    background: transparent;
    position: relative;
    user-select: none;
  }
  .option-label:hover:not(.disabled) {
    border-color: var(--accent);
    background: rgba(61,214,245,0.05);
  }

  .option-label input[type="radio"] { display: none; }

  .option-key {
    display: flex;
    align-items: center;
    justify-content: center;
    min-width: 26px; height: 26px;
    border-radius: 6px;
    background: var(--sky-light);
    border: 1.5px solid var(--neutral);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.72rem;
    font-weight: 600;
    color: var(--text-dim);
    transition: all 0.2s;
    flex-shrink: 0;
  }

  .option-text {
    font-size: 0.92rem;
    line-height: 1.5;
    color: var(--text);
    padding-top: 2px;
  }

  /* Selected */
  .option-label.selected { border-color: var(--accent); background: rgba(61,214,245,0.08); }
  .option-label.selected .option-key { background: var(--accent); border-color: var(--accent); color: var(--sky); }

  /* After reveal */
  .option-label.correct-answer {
    border-color: var(--correct) !important;
    background: rgba(46,204,113,0.1) !important;
  }
  .option-label.correct-answer .option-key {
    background: var(--correct) !important;
    border-color: var(--correct) !important;
    color: #fff !important;
  }
  .option-label.wrong-answer {
    border-color: var(--wrong) !important;
    background: rgba(231,76,60,0.1) !important;
  }
  .option-label.wrong-answer .option-key {
    background: var(--wrong) !important;
    border-color: var(--wrong) !important;
    color: #fff !important;
  }
  .option-label.disabled { cursor: default; }
  .option-label.dimmed { opacity: 0.4; }

  /* Result badge per question */
  .result-badge {
    display: none;
    position: absolute;
    top: -10px; right: 16px;
    font-size: 0.72rem;
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 600;
    padding: 3px 10px;
    border-radius: 99px;
    letter-spacing: 1px;
  }
  .result-badge.show { display: inline-block; }
  .result-badge.ok { background: var(--correct); color: #fff; }
  .result-badge.fail { background: var(--wrong); color: #fff; }

  /* SUBMIT BUTTON */
  .submit-wrap {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    z-index: 200;
    background: linear-gradient(0deg, rgba(10,22,40,1) 60%, transparent);
    padding: 20px 24px 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    flex-wrap: wrap;
  }

  .btn-submit {
    padding: 14px 40px;
    border: none;
    border-radius: var(--radius);
    font-family: 'Sora', sans-serif;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.25s;
    background: linear-gradient(135deg, var(--sun), #FF8C00);
    color: #0A1628;
    box-shadow: 0 4px 24px rgba(245,166,35,0.35);
    letter-spacing: 0.2px;
  }
  .btn-submit:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 32px rgba(245,166,35,0.5);
  }
  .btn-submit:disabled {
    opacity: 0.5;
    cursor: default;
    transform: none;
  }

  .btn-reset {
    padding: 14px 28px;
    border: 1.5px solid var(--card-border);
    border-radius: var(--radius);
    font-family: 'Sora', sans-serif;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.25s;
    background: transparent;
    color: var(--text-dim);
  }
  .btn-reset:hover { border-color: var(--accent); color: var(--accent); }

  .unanswered-msg {
    font-size: 0.85rem;
    color: var(--wrong);
    font-family: 'IBM Plex Mono', monospace;
    display: none;
  }

  /* RESULTS PANEL */
  .results-panel {
    display: none;
    background: linear-gradient(135deg, var(--sky-mid), var(--panel));
    border: 1px solid var(--card-border);
    border-radius: 16px;
    padding: 40px;
    margin: 50px 0 80px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .results-panel::before {
    content: '';
    position: absolute;
    top: -100px; left: 50%;
    transform: translateX(-50%);
    width: 400px; height: 400px;
    background: radial-gradient(ellipse, rgba(245,166,35,0.15) 0%, transparent 70%);
    pointer-events: none;
  }
  .results-panel.show { display: block; }

  .results-emoji { font-size: 3.5rem; margin-bottom: 16px; display: block; }
  .results-grade {
    font-size: clamp(2.5rem, 6vw, 4rem);
    font-weight: 700;
    color: var(--sun);
    font-family: 'IBM Plex Mono', monospace;
  }
  .results-label {
    font-size: 1.4rem;
    font-weight: 600;
    margin: 8px 0 4px;
    color: #fff;
  }
  .results-sub { color: var(--text-dim); font-size: 0.95rem; }

  .results-grid {
    display: flex;
    justify-content: center;
    gap: 32px;
    margin-top: 30px;
    flex-wrap: wrap;
  }
  .res-stat { text-align: center; }
  .res-stat-num {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 1.8rem;
    font-weight: 600;
  }
  .res-stat-num.ok { color: var(--correct); }
  .res-stat-num.fail { color: var(--wrong); }
  .res-stat-num.neutral { color: var(--accent); }
  .res-stat-label { font-size: 0.8rem; color: var(--text-dim); margin-top: 4px; }

  .grade-bar-wrap {
    margin: 24px auto 0;
    max-width: 360px;
    height: 10px;
    background: var(--sky-light);
    border-radius: 99px;
    overflow: hidden;
  }
  .grade-bar {
    height: 100%;
    border-radius: 99px;
    transition: width 1s cubic-bezier(0.22,1,0.36,1);
    background: linear-gradient(90deg, var(--wrong), var(--sun), var(--correct));
  }

  /* SCROLL TO TOP */
  .scroll-top {
    position: fixed;
    bottom: 100px;
    right: 24px;
    z-index: 300;
    width: 42px; height: 42px;
    border-radius: 50%;
    background: var(--panel);
    border: 1px solid var(--card-border);
    color: var(--text-dim);
    font-size: 1.1rem;
    cursor: pointer;
    display: none;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
  }
  .scroll-top.visible { display: flex; }
  .scroll-top:hover { border-color: var(--accent); color: var(--accent); }

  /* Responsive */
  @media (max-width: 600px) {
    .question-card { padding: 20px 16px; }
    .results-panel { padding: 28px 20px; }
    .stats-bar { padding: 10px 16px; gap: 10px; }
  }
</style>
</head>
<body>

<header>
  <div class="sun-icon"></div>
  <h1>Examen · <span>Generación Distribuida</span><br>Solar Fotovoltaica</h1>
  <p>100 preguntas de opción múltiple · Evaluación Integral</p>
</header>

<div class="stats-bar">
  <div class="stat">
    <span class="stat-dot dot-answered"></span>
    Respondidas: <strong id="count-answered">0</strong>/100
  </div>
  <div class="progress-wrap">
    <div class="progress-bar" id="progress-bar"></div>
  </div>
  <div class="stat">
    <span class="stat-dot dot-correct"></span>
    <strong id="count-correct">—</strong>
  </div>
  <div class="stat">
    <span class="stat-dot dot-wrong"></span>
    <strong id="count-wrong">—</strong>
  </div>
</div>

<main id="main-content">
  <!-- Questions injected by JS -->
</main>

<div class="results-panel" id="results-panel">
  <span class="results-emoji" id="results-emoji">🎓</span>
  <div class="results-grade" id="results-grade">—</div>
  <div class="results-label" id="results-label">—</div>
  <div class="results-sub" id="results-sub">—</div>
  <div class="grade-bar-wrap"><div class="grade-bar" id="grade-bar" style="width:0%"></div></div>
  <div class="results-grid">
    <div class="res-stat"><div class="res-stat-num ok" id="r-correct">—</div><div class="res-stat-label">✔ Correctas</div></div>
    <div class="res-stat"><div class="res-stat-num fail" id="r-wrong">—</div><div class="res-stat-label">✘ Incorrectas</div></div>
    <div class="res-stat"><div class="res-stat-num neutral" id="r-pct">—</div><div class="res-stat-label">Porcentaje</div></div>
  </div>
</div>

<div class="submit-wrap">
  <span class="unanswered-msg" id="unanswered-msg">⚠ Respondé todas las preguntas antes de enviar</span>
  <button class="btn-submit" id="btn-submit">Verificar Respuestas</button>
  <button class="btn-reset" id="btn-reset" style="display:none">↩ Reiniciar Examen</button>
</div>

<button class="scroll-top" id="scroll-top" title="Volver arriba">↑</button>

<script>
const SECTIONS = [
  { title: "ENERGÍA SOLAR FOTOVOLTAICA — CONTEXTO Y FUNDAMENTOS", range: [1, 10] },
  { title: "LOS PANELES FOTOVOLTAICOS", range: [11, 25] },
  { title: "CONEXIONADO DE PANELES", range: [26, 32] },
  { title: "EL INVERSOR", range: [33, 42] },
  { title: "SISTEMAS CONECTADOS A RED (ON-GRID)", range: [43, 50] },
  { title: "SISTEMAS AISLADOS (OFF-GRID)", range: [51, 62] },
  { title: "SISTEMAS HÍBRIDOS", range: [63, 67] },
  { title: "DIMENSIONAMIENTO", range: [68, 82] },
  { title: "ESTRUCTURAS E INTEGRACIÓN ARQUITECTÓNICA", range: [83, 89] },
  { title: "BUENAS PRÁCTICAS Y REQUISITOS TÉCNICOS", range: [90, 100] },
];

const QUESTIONS = [
  // SECTION 1
  {
    q: "¿Cuál es la tendencia global de la capacidad instalada en energía solar fotovoltaica en los últimos años?",
    opts: ["Se ha mantenido estable", "Ha disminuido por los altos costos", "Ha crecido exponencialmente, triplicándose en los últimos 5 años", "Ha crecido linealmente en un 10% anual"],
    ans: 2
  },
  {
    q: "En la matriz energética argentina al momento de publicación del manual, ¿qué porcentaje representa la energía solar fotovoltaica?",
    opts: ["4,4%", "6,0%", "1,1%", "27,2%"],
    ans: 2
  },
  {
    q: "¿Cuál es la principal razón por la que el precio de los paneles fotovoltaicos ha declinado fuertemente en los últimos años?",
    opts: ["Reducción de la calidad de los materiales", "Aumento en la producción de escala", "Subsidios gubernamentales directos a fabricantes", "Disminución de la demanda mundial"],
    ans: 1
  },
  {
    q: "¿Qué característica del recurso solar argentino destaca el manual?",
    opts: ["Es el mejor del mundo sin excepción", "Es uno de los mejores del mundo para el aprovechamiento de la tecnología fotovoltaica", "Es adecuado solo en la región patagónica", "Es inferior al promedio global"],
    ans: 1
  },
  {
    q: "¿Qué tipo de sistema fotovoltaico interactúa directamente con la red eléctrica, inyectando energía a la misma?",
    opts: ["Sistema aislado (Off-Grid)", "Sistema híbrido", "Sistema conectado a red (On-Grid)", "Sistema de almacenamiento autónomo"],
    ans: 2
  },
  {
    q: "¿Qué función cumplen las baterías en un sistema Off-Grid?",
    opts: ["Estabilizan la frecuencia de la red", "Almacenan la energía generada durante el día para usarla cuando no hay sol", "Convierten la corriente continua en alterna", "Regulan la tensión de salida al inversor"],
    ans: 1
  },
  {
    q: "Los sistemas híbridos combinan características de los sistemas On-Grid y Off-Grid. ¿Cuál es su función adicional respecto a los sistemas On-Grid convencionales?",
    opts: ["Generan energía únicamente con baterías", "No pueden inyectar energía a la red", "Gestionan la energía para maximizar el autoconsumo y cuentan con circuito de emergencia alimentado por baterías", "Funcionan solo en zonas sin red eléctrica"],
    ans: 2
  },
  {
    q: "Según el manual, ¿cuál es la tecnología de mayor proyección de crecimiento dentro de las energías renovables?",
    opts: ["Eólica offshore", "Bioenergía", "Solar fotovoltaica distribuida", "Solar de concentración"],
    ans: 2
  },
  {
    q: "¿Por qué la tecnología solar fotovoltaica es la más utilizada en instalaciones de generación distribuida?",
    opts: ["Por su bajo costo de mantenimiento exclusivamente", "Por su escalabilidad y facilidad de montaje", "Por ser la única tecnología renovable disponible", "Por requerir poca radiación solar para funcionar"],
    ans: 1
  },
  {
    q: "¿A qué público va dirigido principalmente el manual de Generación Distribuida Solar Fotovoltaica?",
    opts: ["Usuarios residenciales que quieren instalar sus propios paneles", "Profesionales que se dediquen al aprovechamiento fotovoltaico de la energía solar", "Funcionarios del gobierno nacional", "Fabricantes de paneles solares"],
    ans: 1
  },
  // SECTION 2
  {
    q: "¿Qué eficiencia de conversión ofrece, aproximadamente, la tecnología de fabricación basada en silicio convencional?",
    opts: ["6%", "30%", "18%", "50%"],
    ans: 2
  },
  {
    q: "¿Cuál es la eficiencia de conversión de la tecnología \"multijuntura\"?",
    opts: ["18%", "20%", "6%", "30%"],
    ans: 3
  },
  {
    q: "¿Qué ventaja tienen las celdas fotoelectroquímicas respecto a las convencionales de silicio?",
    opts: ["Mayor eficiencia total bajo cualquier condición", "Son más eficientes en condiciones de días nublados", "No requieren mantenimiento", "Tienen mayor potencia por metro cuadrado"],
    ans: 1
  },
  {
    q: "¿Cuál es la eficiencia de conversión de las celdas solares fotoelectroquímicas?",
    opts: ["18%", "20%", "30%", "6%"],
    ans: 3
  },
  {
    q: "¿Cuáles son los tres tipos de celdas de silicio existentes?",
    opts: ["Monocristalino, policristalino y amorfo", "Orgánico, inorgánico y mixto", "Rígido, flexible y semitransparente", "Monocristalino, bifacial y de película delgada"],
    ans: 0
  },
  {
    q: "Las condiciones estándar de ensayo (STC) incluyen: temperatura de celda de 25 °C, irradiancia de 1000 W/m² y:",
    opts: ["Masa de aire AM 1.0", "Masa de aire AM 1.5", "Humedad relativa del 50%", "Viento de 1 m/s"],
    ans: 1
  },
  {
    q: "¿Qué significa \"Watt Pico\" (Wp)?",
    opts: ["La potencia máxima que puede generar un panel bajo cualquier condición", "La potencia que genera el panel bajo condiciones STC", "La potencia promedio anual del panel", "La potencia del panel a temperatura ambiente real"],
    ans: 1
  },
  {
    q: "¿Qué indica el parámetro Voc de un panel fotovoltaico?",
    opts: ["La corriente de cortocircuito", "La tensión en el punto de máxima potencia", "La máxima tensión que se puede obtener del panel con los conectores sin carga", "La tensión de operación nominal"],
    ans: 2
  },
  {
    q: "¿Qué indica el parámetro Isc de un panel fotovoltaico?",
    opts: ["La tensión máxima del panel", "La corriente en el punto de máxima potencia", "La máxima corriente que se puede extraer del panel (cortocircuitando sus terminales)", "La corriente de arranque del inversor"],
    ans: 2
  },
  {
    q: "¿Qué es la curva I-V de un módulo fotovoltaico?",
    opts: ["La variación de la irradiación en función del tiempo", "La variación de la corriente en función de la tensión del panel", "La variación de la potencia en función de la temperatura", "La relación entre voltaje y eficiencia del inversor"],
    ans: 1
  },
  {
    q: "¿Cuál es la principal razón para usar silicio en la mayoría de los paneles comercializados?",
    opts: ["Es el material más eficiente sin excepción", "Presenta la mejor relación de rendimiento en función de su precio", "Es el único material semiconductor disponible", "Resiste mejor las condiciones climáticas extremas"],
    ans: 1
  },

    opts: ["IEC 62109-2", "VDE 0126-1-1", "IEC 61215-1/2:2016", "IEC 62116"],
    ans: 2
  },
  {
    q: "¿Qué certificación de diseño corresponde a los módulos de tipo Película Delgada?",
    opts: ["IEC 61215:2005", "IEC 61646:2008", "IRAM 210013-17", "IEC 61215-1/2:2016"],
    ans: 1
  },
  {
    q: "En un sistema Off-Grid, ¿cuál es la secuencia correcta de pasos para la puesta en marcha?",
    opts: ["Paneles → regulador → baterías → inversor → consumo", "Baterías al inversor → baterías al regulador → paneles al regulador → inversor al consumo", "Inversor → paneles → baterías → consumo", "Consumo → baterías → paneles → regulador"],
    ans: 1
  },
  {
    q: "¿Cuál es la eficiencia aproximada de carga de un regulador PWM?",
    opts: ["60%", "80%", "95–98%", "100%"],
    ans: 1
  },
  {
    q: "Para el dimensionamiento de baterías en un sistema aislado con una demanda de 2000 Wh/día y 3 días de autonomía, ¿qué capacidad mínima debería tener el banco?",
    opts: ["2000 Wh", "6000 Wh", "4000 Wh", "1000 Wh"],
    ans: 1
  },
  {
    q: "¿Qué factor es esencial minimizar en los sistemas aislados para mejorar su desempeño?",
    opts: ["La cantidad de paneles instalados", "Las pérdidas por longitud de cables, reguladores y baterías", "La tensión de las baterías", "La potencia pico del inversor"],
    ans: 1
  },
  {
    q: "¿Qué ocurre en un sistema On-Grid cuando la generación fotovoltaica supera el consumo instantáneo del usuario?",
    opts: ["El inversor se apaga para evitar daños", "La energía excedente se inyecta a la red eléctrica", "La energía excedente se disipa como calor", "El sistema almacena el exceso en las baterías internas del inversor"],
    ans: 1
  },
  {
    q: "Según el ejemplo del manual para Buenos Aires (4 paneles de 250 Wp), ¿qué porcentaje aproximado de la energía total generada corresponde al autoconsumo estimado?",
    opts: ["10%", "20%", "40%", "60%"],
    ans: 2
  },
];

const KEYS = ['A','B','C','D'];
let submitted = false;

function buildExam() {
  const main = document.getElementById('main-content');
  let sIdx = 0;
  let html = '';

  QUESTIONS.forEach((q, i) => {
    const num = i + 1;
    // Section heading
    const sec = SECTIONS[sIdx];
    if (sec && num === sec.range[0]) {
      html += `
        <div class="section-heading">
          <span class="section-number">Sección ${sIdx + 1}</span>
          <span class="section-title">${sec.title}</span>
          <div class="section-line"></div>
        </div>`;
      if (num === sec.range[1] || i === QUESTIONS.length - 1) sIdx++;
    }

    html += `
      <div class="question-card" id="card-${i}">
        <span class="result-badge" id="badge-${i}"></span>
        <span class="question-number">PREGUNTA ${String(num).padStart(3,'0')}</span>
        <p class="question-text">${q.q}</p>
        <div class="options" id="opts-${i}">
          ${q.opts.map((opt, k) => `
            <label class="option-label" id="opt-${i}-${k}" for="r-${i}-${k}">
              <input type="radio" name="q${i}" id="r-${i}-${k}" value="${k}" onchange="onSelect(${i},${k})">
              <span class="option-key">${KEYS[k]}</span>
              <span class="option-text">${opt}</span>
            </label>
          `).join('')}
        </div>
      </div>`;

    if (sec && num === sec.range[1]) sIdx++;
  });

  main.innerHTML = html;
}

function onSelect(qIdx, optIdx) {
  if (submitted) return;
  // Clear previous selection
  QUESTIONS[qIdx].opts.forEach((_, k) => {
    document.getElementById(`opt-${qIdx}-${k}`).classList.remove('selected');
  });
  document.getElementById(`opt-${qIdx}-${optIdx}`).classList.add('selected');
  updateStats();
}

function getSelected(qIdx) {
  for (let k = 0; k < QUESTIONS[qIdx].opts.length; k++) {
    const el = document.getElementById(`r-${qIdx}-${k}`);
    if (el && el.checked) return k;
  }
  return null;
}

function updateStats() {
  let answered = 0;
  QUESTIONS.forEach((_, i) => { if (getSelected(i) !== null) answered++; });
  document.getElementById('count-answered').textContent = answered;
  document.getElementById('progress-bar').style.width = (answered / QUESTIONS.length * 100) + '%';
}

function submitExam() {
  const unanswered = [];
  QUESTIONS.forEach((_, i) => { if (getSelected(i) === null) unanswered.push(i + 1); });

  const msg = document.getElementById('unanswered-msg');
  if (unanswered.length > 0) {
    msg.style.display = 'inline';
    // Scroll to first unanswered
    document.getElementById(`card-${unanswered[0]-1}`).scrollIntoView({behavior:'smooth', block:'center'});
    return;
  }
  msg.style.display = 'none';
  submitted = true;

  let correct = 0, wrong = 0;

  QUESTIONS.forEach((q, i) => {
    const sel = getSelected(i);
    const card = document.getElementById(`card-${i}`);
    const badge = document.getElementById(`badge-${i}`);

    // Disable all options
    q.opts.forEach((_, k) => {
      const lbl = document.getElementById(`opt-${i}-${k}`);
      lbl.classList.add('disabled');
      document.getElementById(`r-${i}-${k}`).disabled = true;
    });

    if (sel === q.ans) {
      correct++;
      document.getElementById(`opt-${i}-${q.ans}`).classList.add('correct-answer');
      card.classList.add('all-correct');
      badge.className = 'result-badge show ok';
      badge.textContent = '✔ CORRECTO';
    } else {
      wrong++;
      document.getElementById(`opt-${i}-${sel}`).classList.add('wrong-answer');
      document.getElementById(`opt-${i}-${q.ans}`).classList.add('correct-answer');
      card.classList.add('has-wrong');
      badge.className = 'result-badge show fail';
      badge.textContent = '✘ INCORRECTO';
      // Dim other options
      q.opts.forEach((_, k) => {
        if (k !== sel && k !== q.ans) document.getElementById(`opt-${i}-${k}`).classList.add('dimmed');
      });
    }
  });

  // Update stat bar
  document.getElementById('count-correct').textContent = '✔ ' + correct;
  document.getElementById('count-wrong').textContent = '✘ ' + wrong;

  // Show results panel
  const pct = Math.round(correct / QUESTIONS.length * 100);
  const panel = document.getElementById('results-panel');
  panel.classList.add('show');
  document.getElementById('r-correct').textContent = correct;
  document.getElementById('r-wrong').textContent = wrong;
  document.getElementById('r-pct').textContent = pct + '%';
  document.getElementById('results-grade').textContent = correct + '/100';

  let emoji, label, sub;
  if (pct >= 90)      { emoji='🏆'; label='Sobresaliente'; sub='Excelente dominio del contenido del manual.'; }
  else if (pct >= 75) { emoji='🌟'; label='Muy Bueno'; sub='Sólido conocimiento de generación distribuida.'; }
  else if (pct >= 60) { emoji='☀️'; label='Bueno'; sub='Buen nivel general, con algunos temas a repasar.'; }
  else if (pct >= 50) { emoji='⚡'; label='Suficiente'; sub='Aprobado, pero conviene repasar el manual.'; }
  else                { emoji='📘'; label='Insuficiente'; sub='Se recomienda releer el manual completo.'; }

  document.getElementById('results-emoji').textContent = emoji;
  document.getElementById('results-label').textContent = label;
  document.getElementById('results-sub').textContent = sub;

  setTimeout(() => {
    document.getElementById('grade-bar').style.width = pct + '%';
  }, 200);

  panel.scrollIntoView({behavior:'smooth'});

  // Toggle buttons
  document.getElementById('btn-submit').style.display = 'none';
  document.getElementById('btn-reset').style.display = 'inline-block';
}

function resetExam() {
  submitted = false;
  document.getElementById('results-panel').classList.remove('show');
  document.getElementById('count-correct').textContent = '—';
  document.getElementById('count-wrong').textContent = '—';
  document.getElementById('count-answered').textContent = '0';
  document.getElementById('progress-bar').style.width = '0%';
  document.getElementById('grade-bar').style.width = '0%';
  document.getElementById('btn-submit').style.display = 'inline-block';
  document.getElementById('btn-reset').style.display = 'none';
  buildExam();
  window.scrollTo({top:0, behavior:'smooth'});
}

// Scroll to top button
window.addEventListener('scroll', () => {
  const btn = document.getElementById('scroll-top');
  btn.classList.toggle('visible', window.scrollY > 400);
});
document.getElementById('scroll-top').addEventListener('click', () => {
  window.scrollTo({top:0, behavior:'smooth'});
});

document.getElementById('btn-submit').addEventListener('click', submitExam);
document.getElementById('btn-reset').addEventListener('click', resetExam);

buildExam();
</script>
</body>
</html>
